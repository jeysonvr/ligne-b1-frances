<title>Ligne B1 · Français</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: the course is a metro line — a sticky sidebar of stations (learning order) beside one reading column;
   each lesson opens with a Paris street-plaque header. Blue enamel is the one bold element; everything else stays quiet. */
:root {
  --paper: #F4F6FA;
  --surface: #FFFFFF;
  --sunk: #EBEFF6;
  --ink: #141B2D;
  --muted: #56607A;
  --line: #D8DEE9;
  --bleu: #213E8C;
  --plaque-ink: #FFFFFF;
  --plaque-frame: #2C6A4E;
  --accent: #2C57CF;
  --accent-ink: #FFFFFF;
  --accent-soft: #E4EBFD;
  --rouge: #C4303A;
  --rouge-soft: #FBE8E9;
  --ok: #1B7F53;
  --ok-soft: #E1F3EA;
  --or: #8E6410;
  --or-soft: #FAF0DA;
  --shadow: 0 1px 2px rgba(20,27,45,.06), 0 8px 24px rgba(20,27,45,.06);
  --f-display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r: 10px;
  --side: 300px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0D121E; --surface: #141A29; --sunk: #1A2234; --ink: #E5E9F2; --muted: #9AA4BB; --line: #28314A;
    --bleu: #26489C; --plaque-frame: #3A8563; --accent: #88A7FF; --accent-ink: #0D121E; --accent-soft: #1C2848;
    --rouge: #FF7B82; --rouge-soft: #3A1C23; --ok: #50C88C; --ok-soft: #13302A; --or: #E2B458; --or-soft: #33280F;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0D121E; --surface: #141A29; --sunk: #1A2234; --ink: #E5E9F2; --muted: #9AA4BB; --line: #28314A;
  --bleu: #26489C; --plaque-frame: #3A8563; --accent: #88A7FF; --accent-ink: #0D121E; --accent-soft: #1C2848;
  --rouge: #FF7B82; --rouge-soft: #3A1C23; --ok: #50C88C; --ok-soft: #13302A; --or: #E2B458; --or-soft: #33280F;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--paper); color: var(--ink); font: 16px/1.6 var(--f-body); }
a { color: var(--accent); text-underline-offset: 3px; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
.fr { font-style: normal; }
em, i { font-style: italic; }
b, strong { font-weight: 650; }

/* ---------- Shell ---------- */
.app { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100vh; }
.side {
  position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto;
  background: var(--surface); border-right: 1px solid var(--line);
  padding: 22px 18px 40px; display: flex; flex-direction: column; gap: 18px;
  scrollbar-width: thin;
}
.brand { display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: var(--ink); }
.tricolore { display: flex; height: 4px; width: 56px; border-radius: 2px; overflow: hidden; }
.tricolore i { flex: 1; transform-origin: left; animation: grow .7s cubic-bezier(.2,.8,.2,1) both; }
.tricolore i:nth-child(1) { background: var(--bleu); }
.tricolore i:nth-child(2) { background: var(--line); animation-delay: .12s; }
.tricolore i:nth-child(3) { background: var(--rouge); animation-delay: .24s; }
.brand-name { font-family: var(--f-display); font-size: 28px; font-weight: 700; letter-spacing: -.01em; line-height: 1; }
.brand-name em { font-weight: 500; }
.brand-sub { font-size: 12.5px; color: var(--muted); }
.meter { display: grid; gap: 6px; }
.meter-row { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width .8s cubic-bezier(.2,.8,.2,1); }

.route { display: flex; flex-direction: column; gap: 14px; }
.route-group h4 {
  margin: 0 0 4px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600;
  display: flex; gap: 8px; align-items: center;
}
.route-group h4 .mod { font-family: var(--f-mono); letter-spacing: 0; color: var(--bleu); font-weight: 500; }
:root[data-theme="dark"] .route-group h4 .mod { color: var(--accent); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .route-group h4 .mod { color: var(--accent); } }
.route ol { list-style: none; margin: 0; padding: 0; }
.stop a {
  position: relative; display: grid; grid-template-columns: 22px minmax(0,1fr); gap: 10px; align-items: start;
  padding: 6px 8px 6px 4px; border-radius: 8px; text-decoration: none; color: var(--ink);
}
.stop a::before { /* the line between stations */
  content: ""; position: absolute; left: 14px; top: 0; bottom: 0; width: 3px; background: var(--line); border-radius: 2px;
}
.stop:first-child a::before { top: 14px; }
.stop:last-child a::before { bottom: calc(100% - 14px); }
.stop .dot {
  position: relative; z-index: 1; width: 16px; height: 16px; margin: 3px 0 0 3px; border-radius: 50%; padding: 3px;
  background: conic-gradient(var(--accent) var(--p, 0%), var(--line) 0); transition: transform .25s;
}
.stop .dot::after { content: ""; display: block; width: 100%; height: 100%; border-radius: 50%; background: var(--surface); transition: background .25s; }
.stop.done .dot::after { background: var(--accent); }
.stop.done a::before { background: var(--accent); opacity: .35; }
.stop .t { display: flex; flex-direction: column; min-width: 0; }
.stop .t b { font-weight: 600; font-size: 14px; line-height: 1.3; }
.stop .t span { font-size: 12px; color: var(--muted); line-height: 1.35; }
.stop .num { font-family: var(--f-mono); font-size: 11px; color: var(--muted); margin-right: 6px; font-weight: 400; }
.stop a:hover { background: var(--sunk); }
.stop a:hover .dot { transform: scale(1.15); }
.stop a[aria-current="page"] { background: var(--accent-soft); }
.stop a[aria-current="page"] .dot { transform: scale(1.25); box-shadow: 0 0 0 4px var(--accent-soft); }
.stop.tool .dot { border-radius: 4px; }

.topbar { display: none; }
.scrim { display: none; }

.main { min-width: 0; padding-inline: clamp(16px, 4vw, 56px); padding-block: 36px 80px; }
.view { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px; }
.view.enter { animation: rise .5s cubic-bezier(.2,.8,.2,1) both; }

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .topbar {
    display: flex; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line);
  }
  .topbar .brand { flex-direction: row; align-items: center; gap: 10px; }
  .topbar .brand-name { font-size: 22px; }
  .menu-btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-weight: 600; font-size: 14px; }
  .menu-btn .mini { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-weight: 400; }
  .side {
    position: fixed; z-index: 50; inset: 0 auto 0 0; width: min(340px, 88vw); height: 100%;
    padding-top: calc(22px + env(safe-area-inset-top, 0px)); padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-102%); transition: transform .35s cubic-bezier(.2,.8,.2,1); box-shadow: var(--shadow);
  }
  body.nav-open .side { transform: none; }
  .scrim { display: block; position: fixed; inset: 0; z-index: 40; background: rgba(10,14,24,.45); opacity: 0; pointer-events: none; transition: opacity .3s; }
  body.nav-open .scrim { opacity: 1; pointer-events: auto; }
  .main { padding-block: 24px 64px; }
}

/* ---------- Type & blocks ---------- */
.eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.h2 { font-family: var(--f-display); font-size: clamp(26px, 3.2vw, 32px); font-weight: 650; line-height: 1.15; letter-spacing: -.01em; }
.h3 { font-size: 18px; font-weight: 650; line-height: 1.3; }
.lead { font-size: 18px; color: var(--muted); max-width: 62ch; }
.prose { display: flex; flex-direction: column; gap: 14px; }
.prose p, .prose li { max-width: 68ch; }
.prose ul, .prose ol { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.section { display: flex; flex-direction: column; gap: 18px; scroll-margin-top: 80px; }
.section-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.section-head .count { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }

.note { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 12px; align-items: start; padding: 14px 16px; border-radius: var(--r); background: var(--sunk); }
.note .tag { font-size: 10.5px; letter-spacing: .12em; font-weight: 700; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; white-space: nowrap; margin-top: 2px; }
.note.rule { background: var(--accent-soft); } .note.rule .tag { background: var(--accent); color: var(--accent-ink); }
.note.tip { background: var(--or-soft); } .note.tip .tag { background: var(--or); color: var(--surface); }
.note.trap { background: var(--rouge-soft); } .note.trap .tag { background: var(--rouge); color: var(--surface); }
.note.delf { background: var(--sunk); } .note.delf .tag { background: var(--ink); color: var(--surface); }
.note.info .tag { background: var(--muted); color: var(--surface); }
.note > div { min-width: 0; }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--sunk); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td:first-child { font-weight: 600; }
.table-wrap.plain td:first-child { font-weight: 400; }

.chips-nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; display: flex; gap: 6px; overflow-x: auto; padding: 10px 0; background: var(--paper); scrollbar-width: none; margin-block: -20px; }
.chips-nav::-webkit-scrollbar { display: none; }
@media (max-width: 900px) { .chips-nav { top: calc(57px + env(safe-area-inset-top, 0px)); } .section { scroll-margin-top: 124px; } }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 14px; font-size: 13.5px; font-weight: 500; text-decoration: none; transition: background .2s, border-color .2s, color .2s; }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* ---------- Plaque (lesson header) ---------- */
.plaque-wrap { display: flex; flex-direction: column; gap: 16px; }
.plaque {
  position: relative; align-self: flex-start; max-width: 100%;
  background: var(--bleu); color: var(--plaque-ink); border-radius: 14px; padding: 6px;
  box-shadow: 0 0 0 4px var(--plaque-frame), var(--shadow);
  margin: 4px;
  animation: plaque .8s cubic-bezier(.2,.9,.25,1.15) both; transform-origin: 50% 0;
}
.plaque-in { border: 2px solid var(--plaque-ink); border-radius: 9px; padding: 12px clamp(16px, 3vw, 28px) 16px; text-align: center; display: flex; flex-direction: column; gap: 4px; }
.plaque .arr { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; font-weight: 600; opacity: .9; }
.plaque .arr sup { font-size: .7em; }
.plaque h1 { font-family: var(--f-display); font-size: clamp(30px, 5.4vw, 50px); line-height: 1.05; font-weight: 700; letter-spacing: -.01em; }
.plaque .rule-line { height: 2px; width: 48px; background: var(--plaque-ink); margin: 6px auto 2px; opacity: .8; }
.plaque .es { font-size: 14px; opacity: .92; }
.lesson-meta { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13.5px; color: var(--muted); }
.lesson-meta span { display: inline-flex; align-items: center; gap: 6px; }

/* ---------- Vocabulary & examples ---------- */
.vocab { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.vocab-group { display: flex; flex-direction: column; gap: 10px; }
.vocab-group h3 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.term { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 2px 8px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); transition: border-color .2s, transform .2s; }
.term:hover { border-color: var(--accent); transform: translateY(-1px); }
.term .fr { grid-column: 1; grid-row: 1; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.term .es { grid-column: 1; grid-row: 2; font-size: 13.5px; color: var(--muted); }
.term .say { grid-row: 1 / span 2; grid-column: 2; }

.examples { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.examples li { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 2px 12px; padding: 12px 0; border-bottom: 1px dashed var(--line); }
.examples li:last-child { border-bottom: 0; }
.examples .fr { grid-column: 1; grid-row: 1; font-family: var(--f-display); font-size: 19px; line-height: 1.4; font-weight: 500; }
.examples .es { grid-column: 1; grid-row: 2; font-size: 14px; color: var(--muted); }
.examples .say { grid-row: 1 / span 2; grid-column: 2; align-self: center; }

.say { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: inline-grid; place-items: center; color: var(--muted); transition: color .2s, border-color .2s, transform .2s; flex: none; }
.say:hover { color: var(--accent); border-color: var(--accent); transform: scale(1.06); }
.say.speaking { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); animation: pulse 1s infinite; }
.say svg { width: 16px; height: 16px; }
.no-tts .say { display: none; }

.links { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.links a { display: flex; flex-direction: column; gap: 4px; height: 100%; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); text-decoration: none; color: var(--ink); transition: border-color .2s, transform .2s, box-shadow .2s; }
.links a:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow); }
.links .ln { font-weight: 650; display: flex; justify-content: space-between; gap: 8px; }
.links .ln svg { flex: none; width: 14px; height: 14px; margin-top: 4px; color: var(--muted); }
.links .ld { font-size: 13.5px; color: var(--muted); }
.links .lu { font-family: var(--f-mono); font-size: 11.5px; color: var(--accent); margin-top: auto; padding-top: 4px; overflow-wrap: anywhere; }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; padding: 10px 20px; font-weight: 600; font-size: 15px; border: 1px solid transparent; text-decoration: none; transition: transform .15s, background .2s, box-shadow .2s, opacity .2s; }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 35%, transparent); }
.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--accent); color: var(--accent); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn svg { width: 16px; height: 16px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* ---------- Games ---------- */
.games-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.game { border: 1px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); overflow: hidden; }
.game-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; padding: 18px 20px 14px; }
.game-head > div { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.game-inst { font-size: 14px; color: var(--muted); }
.game-score { flex: none; text-align: right; font-variant-numeric: tabular-nums; }
.game-score b { font-family: var(--f-display); font-size: 30px; line-height: 1; display: block; }
.game-score span { font-size: 12px; color: var(--muted); }
.game-progress { height: 4px; background: var(--sunk); }
.game-progress i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--bleu), var(--accent)); transition: width .45s cubic-bezier(.2,.8,.2,1); }
.game-body { padding: 22px 20px 22px; display: flex; flex-direction: column; gap: 16px; min-height: 180px; }
.q { font-size: 20px; line-height: 1.5; font-family: var(--f-display); font-weight: 500; }
.q .hint { font-family: var(--f-body); font-size: 14px; color: var(--muted); display: block; margin-top: 4px; }
.q-card { animation: rise .35s cubic-bezier(.2,.8,.2,1) both; display: flex; flex-direction: column; gap: 16px; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; }
.opt { text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 12px 14px; font-size: 16px; transition: border-color .15s, background .15s, transform .15s; }
.opt:hover:not([disabled]) { border-color: var(--accent); transform: translateY(-1px); }
.opt[disabled] { cursor: default; }
.opt.ok, .ok-state { border-color: var(--ok); background: var(--ok-soft); animation: pop .4s cubic-bezier(.2,.9,.3,1.4); }
.opt.ko, .ko-state { border-color: var(--rouge); background: var(--rouge-soft); animation: shake .4s; }
.opt.dim { opacity: .55; }
.feedback { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 10px; font-size: 15px; animation: rise .3s both; }
.feedback.good { background: var(--ok-soft); color: var(--ink); }
.feedback.bad { background: var(--rouge-soft); color: var(--ink); }
.feedback.warn { background: var(--or-soft); color: var(--ink); }
.feedback .fi { font-weight: 700; flex: none; }
.feedback.good .fi { color: var(--ok); } .feedback.bad .fi { color: var(--rouge); } .feedback.warn .fi { color: var(--or); }
.game-foot { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }

.blank { display: inline-block; min-width: 5ch; max-width: 100%; border: 0; border-bottom: 2px solid var(--accent); background: var(--accent-soft); border-radius: 6px 6px 0 0; padding: 2px 8px; margin: 2px 2px; font-family: var(--f-body); font-size: 17px; font-weight: 600; text-align: center; transition: background .2s, border-color .2s; }
.blank:focus { outline: none; background: var(--surface); box-shadow: 0 0 0 2px var(--accent); }
.blank.ok { border-color: var(--ok); background: var(--ok-soft); animation: pop .4s; }
.blank.ko { border-color: var(--rouge); background: var(--rouge-soft); animation: shake .4s; }
.accents { display: flex; flex-wrap: wrap; gap: 4px; }
.accents button { min-width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--sunk); font-size: 15px; }
.accents button:hover { border-color: var(--accent); }

.sort-stage { display: flex; flex-direction: column; align-items: center; gap: 20px; }
.sort-card { min-height: 84px; width: min(460px, 100%); display: grid; place-items: center; text-align: center; padding: 18px 20px; border-radius: 14px; background: var(--sunk); border: 1.5px dashed var(--line); font-family: var(--f-display); font-size: 22px; font-weight: 600; line-height: 1.3; animation: deal .45s cubic-bezier(.2,.9,.3,1.2) both; }
.sort-card.fly { animation: fly .45s cubic-bezier(.5,0,.8,.4) forwards; }
.sort-card.ko-state { animation: shake .4s; }
.buckets { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; width: 100%; }
.bucket { border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; align-items: center; font-weight: 650; transition: border-color .15s, transform .15s, background .2s; }
.bucket:hover:not([disabled]) { border-color: var(--accent); transform: translateY(-2px); }
.bucket small { font-weight: 400; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
